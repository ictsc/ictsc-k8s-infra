---
- name: Ensure lvm2 installed
  ansible.builtin.package:
    name: lvm2
    state: present

- name: Ensure lvm2-monitor service is enabled and started
  ansible.builtin.systemd:
    name: lvm2-monitor
    enabled: true
    state: started

- name: Ensure /dev/vdb is a LVM PV
  community.general.lvm_pv:
    device: /dev/vdb
    resize: true

- name: Ensure LVM VG ssd_vg exists
  community.general.lvg:
    vg: ssd_vg
    pvs: /dev/vdb

- name: Ensure containerd.d directory exists
  ansible.builtin.file:
    path: /etc/k0s/containerd.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Ensure containerd.d/certs.d directory exists
  ansible.builtin.file:
    path: /etc/k0s/containerd.d/certs.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Deploy cri-registry.toml
  ansible.builtin.template:
    src: cri-registry.toml.j2
    dest: /etc/k0s/containerd.d/cri-registry.toml
    mode: "0644"
    owner: root
    group: root
  notify: Restart k0s worker

- name: Create docker.io registry mirror directory
  ansible.builtin.file:
    path: /etc/k0s/containerd.d/certs.d/docker.io
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Deploy docker.io mirror hosts.toml
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: /etc/k0s/containerd.d/certs.d/docker.io/hosts.toml
    mode: "0644"
    owner: root
    group: root
  notify: Restart k0s worker
