---
- name: Check if swap file exists
  ansible.builtin.stat:
    path: "{{ setup_swap_file_path }}"
  register: setup_swap_file_stat

- name: Create swap file
  ansible.builtin.command:
    cmd: fallocate -l {{ setup_swap_file_size_gb }}G {{ setup_swap_file_path }}
    creates: "{{ setup_swap_file_path }}"
  when: not setup_swap_file_stat.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ setup_swap_file_path }}"
    mode: "0600"
    owner: root
    group: root

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap {{ setup_swap_file_path }}
  when: not setup_swap_file_stat.stat.exists
  register: setup_swap_mkswap_result
  changed_when: setup_swap_mkswap_result.rc == 0

- name: Set vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ setup_swap_swappiness }}"
    state: present
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-swappiness.conf
    reload: true

- name: Deploy systemd swap unit file
  ansible.builtin.template:
    src: swapfile.swap.j2
    dest: /etc/systemd/system/swapfile.swap
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd
    - Restart swap

- name: Enable and start swap
  ansible.builtin.systemd:
    name: swapfile.swap
    enabled: true
    state: started
