apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  annotations:
    cert-manager.io/issuer: letsencrypt
spec:
  gatewayClassName: web-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: argocd-https
      hostname: argocd.$k8s-base-host
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argo-system
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-with-auth
  annotations:
    cert-manager.io/issuer: letsencrypt
spec:
  gatewayClassName: web-gateway
  listeners:
    - name: hubble-https
      hostname: hubble.$k8s-base-host
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      tls:
        mode: Terminate
        certificateRefs:
          - name: hubble-tls
