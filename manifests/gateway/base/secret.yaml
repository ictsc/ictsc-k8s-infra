apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sakuracloud-secret
spec:
  provider: sakuracloud
  parameters:
    vaultID: $vault-id
    secrets: |
      - name: auth-proxy-client-secret
  secretObjects:
    - secretName: auth-proxy-client-secret
      annotations:
        client-id: $auth-proxy-client-id
      type: Opaque
      data:
        - objectName: auth-proxy-client-secret
          key: client-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-pin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-pin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-pin
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            limits:
              cpu: 2m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 1Mi
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sakuracloud-secret
