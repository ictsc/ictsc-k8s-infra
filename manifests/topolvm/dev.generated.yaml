---
apiVersion: scheduling.k8s.io/v1
description: Pods using TopoLVM volumes should use this class.
globalDefault: false
kind: PriorityClass
metadata:
  name: topolvm
value: 1000000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: topolvm
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: topolvm
    app.kubernetes.io/version: 0.38.0
    helm.sh/chart: topolvm-15.7.0
  name: topolvm-controller
  namespace: topolvm-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: topolvm
      app.kubernetes.io/name: topolvm
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: topolvm
        app.kubernetes.io/name: topolvm
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                - controller
              - key: app.kubernetes.io/name
                operator: In
                values:
                - topolvm
            topologyKey: kubernetes.io/hostname
      containers:
      - command:
        - /topolvm-controller
        - --leader-election-namespace=topolvm-system
        - --cert-dir=/certs
        image: ghcr.io/topolvm/topolvm-with-sidecar:0.38.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 3
        name: topolvm-controller
        ports:
        - containerPort: 9443
          name: webhook
          protocol: TCP
        - containerPort: 9808
          name: healthz
          protocol: TCP
        - containerPort: 8081
          name: readyz
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: readyz
            scheme: HTTP
        volumeMounts:
        - mountPath: /run/topolvm
          name: socket-dir
        - mountPath: /certs
          name: certs
      - command:
        - /csi-provisioner
        - --csi-address=/run/topolvm/csi-topolvm.sock
        - --feature-gates=Topology=true
        - --leader-election
        - --leader-election-namespace=topolvm-system
        - --http-endpoint=:9809
        - --enable-capacity
        - --capacity-ownerref-level=2
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        image: ghcr.io/topolvm/topolvm-with-sidecar:0.38.0
        name: csi-provisioner
        ports:
        - containerPort: 9809
          name: csi-provisioner
        volumeMounts:
        - mountPath: /run/topolvm
          name: socket-dir
      - command:
        - /csi-resizer
        - --csi-address=/run/topolvm/csi-topolvm.sock
        - --leader-election
        - --leader-election-namespace=topolvm-system
        - --http-endpoint=:9810
        image: ghcr.io/topolvm/topolvm-with-sidecar:0.38.0
        name: csi-resizer
        ports:
        - containerPort: 9810
          name: csi-resizer
        volumeMounts:
        - mountPath: /run/topolvm
          name: socket-dir
      - command:
        - /csi-snapshotter
        - --csi-address=/run/topolvm/csi-topolvm.sock
        - --leader-election
        - --leader-election-namespace=topolvm-system
        - --http-endpoint=:9811
        image: ghcr.io/topolvm/topolvm-with-sidecar:0.38.0
        name: csi-snapshotter
        ports:
        - containerPort: 9811
          name: csi-snapshotter
        volumeMounts:
        - mountPath: /run/topolvm
          name: socket-dir
      - command:
        - /livenessprobe
        - --csi-address=/run/topolvm/csi-topolvm.sock
        - --http-endpoint=:9808
        image: ghcr.io/topolvm/topolvm-with-sidecar:0.38.0
        name: liveness-probe
        volumeMounts:
        - mountPath: /run/topolvm
          name: socket-dir
      securityContext:
        runAsGroup: 10000
        runAsUser: 10000
      serviceAccountName: topolvm-controller
      volumes:
      - name: certs
        secret:
          secretName: topolvm-mutatingwebhook
      - emptyDir: {}
        name: socket-dir
