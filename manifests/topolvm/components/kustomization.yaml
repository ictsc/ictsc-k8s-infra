apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # Since CRD generation cannot be disabled in the Helm Chart, use config.kubernetes.io/local-config to remove it from the result
  - target:
      kind: CustomResourceDefinition
      name: logicalvolumes.topolvm.io
    patch: |-
      - op: add
        path: /metadata/annotations/config.kubernetes.io~1local-config
        value: "true"

  # Security hardening: Add /tmp mount to topolvm-node container
  # Note: securityContext (readOnlyRootFilesystem) and tmp-dir volume are set via values.yaml
  - target:
      kind: DaemonSet
      name: topolvm-node
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          mountPath: /tmp
          name: tmp-dir
