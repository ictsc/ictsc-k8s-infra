storageClasses:
  - name: topolvm-provisioner
    storageClass:
      fsType: ext4
      allowVolumeExpansion: true

lvmd:
  deviceClasses:
    - name: ssd
      volume-group: ssd_vg
      default: true
      spare-gb: 10
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  securityContext:
    readOnlyRootFilesystem: true

controller:
  securityContext:
    readOnlyRootFilesystem: true

node:
  kubeletWorkDirectory: /var/lib/k0s/kubelet
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true
