apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
---
# Ref: https://github.com/cloudnative-pg/cloudnative-pg/blob/9daa681325034a6b6548e347bbc4c0b54ea668db/config/rbac/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-manager
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups: [""]
    resources:
      - configmaps/status
      - secrets/status
    verbs:
      - get
      - patch
      - update
  - apiGroups: [""]
    resources: ["events"]
    verbs:
      - create
      - patch
  - apiGroups: [""]
    resources: ["nodes"]
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - pods
      - pods/exec
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs:
      - create
      - get
      - update
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - backups
      - clusters
      - databases
      - poolers
      - publications
      - scheduledbackups
      - subscriptions
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - backups/status
      - databases/status
      - publications/status
      - scheduledbackups/status
      - subscriptions/status
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusterimagecatalogs
      - imagecatalogs
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters/finalizers
      - poolers/finalizers
    verbs: ["update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters/status
      - failoverquorums/status
      - poolers/status
    verbs:
      - get
      - patch
      - update
      - watch
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["failoverquorums"]
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
      - roles
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs:
      - create
      - get
      - list
      - patch
      - watch
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors"]
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-pg-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnative-pg-manager
subjects:
  - kind: ServiceAccount
    name: manager
