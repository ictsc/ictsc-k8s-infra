resources:
  - ../base

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.6.0
    releaseName: eg
    namespace: envoy-gateway-system
    valuesFile: ../base/helm-values.yaml

patches:
  - target:
      kind: Deployment
      name: envoy-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: envoy-gateway
