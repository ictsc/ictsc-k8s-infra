apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # Discord webhook service configuration
  service.webhook.discord: |
    url: $discord-webhook-url
    headers:
    - name: Content-Type
      value: application/json

  # Template for deployment success
  template.app-deployed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [
              {
                "title": "✅ Application Deployed",
                "description": "Application **{{.app.metadata.name}}** has been successfully deployed.",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Sync Status",
                    "value": "{{.app.status.sync.status}}",
                    "inline": true
                  },
                  {
                    "name": "Health Status",
                    "value": "{{.app.status.health.status}}",
                    "inline": true
                  },
                  {
                    "name": "Revision",
                    "value": "{{.app.status.sync.revision}}",
                    "inline": false
                  }
                ],
                "timestamp": "{{.app.status.operationState.finishedAt}}"
              }
            ]
          }

  # Template for sync failure
  template.app-sync-failed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [
              {
                "title": "❌ Sync Failed",
                "description": "Application **{{.app.metadata.name}}** sync has failed.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Sync Status",
                    "value": "{{.app.status.sync.status}}",
                    "inline": true
                  },
                  {
                    "name": "Error Message",
                    "value": "{{.app.status.operationState.message}}",
                    "inline": false
                  }
                ],
                "timestamp": "{{.app.status.operationState.finishedAt}}"
              }
            ]
          }

  # Template for health degraded
  template.app-health-degraded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [
              {
                "title": "⚠️ Health Degraded",
                "description": "Application **{{.app.metadata.name}}** health status has degraded.",
                "color": 16776960,
                "fields": [
                  {
                    "name": "Health Status",
                    "value": "{{.app.status.health.status}}",
                    "inline": true
                  },
                  {
                    "name": "Sync Status",
                    "value": "{{.app.status.sync.status}}",
                    "inline": true
                  }
                ]
              }
            ]
          }

  # Triggers
  trigger.on-deployed: |
    - description: Application is synced and healthy
      send:
      - app-deployed
      when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'

  trigger.on-sync-failed: |
    - description: Application sync has failed
      send:
      - app-sync-failed
      when: app.status.operationState.phase in ['Error', 'Failed']

  trigger.on-health-degraded: |
    - description: Application health status has degraded
      send:
      - app-health-degraded
      when: app.status.health.status == 'Degraded'

  # Default subscriptions for all applications
  # These subscriptions will trigger notifications for every ArgoCD application in the cluster
  # unless overridden with per-application annotations (notifications.argoproj.io/subscribe.<trigger>.<service>)
  subscriptions: |
    - recipients:
      - discord
      triggers:
      - on-deployed
      - on-sync-failed
      - on-health-degraded
