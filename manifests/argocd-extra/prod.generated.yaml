apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: secret-pin
  name: secret-pin
  namespace: argo-system
---
apiVersion: v1
data:
  service.webhook.discord: |
    url: $discord-webhook-url
    headers:
    - name: Content-Type
      value: application/json
  subscriptions: |
    - recipients:
      - discord
      triggers:
      - on-deployed
      - on-sync-failed
      - on-health-degraded
  template.app-deployed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [
              {
                "title": "✅ Application Deployed",
                "description": "Application **{{.app.metadata.name}}** has been successfully deployed.",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Sync Status",
                    "value": "{{.app.status.sync.status}}",
                    "inline": true
                  },
                  {
                    "name": "Health Status",
                    "value": "{{.app.status.health.status}}",
                    "inline": true
                  },
                  {
                    "name": "Revision",
                    "value": "{{.app.status.sync.revision}}",
                    "inline": false
                  }
                ],
                "timestamp": "{{.app.status.operationState.finishedAt}}"
              }
            ]
          }
  template.app-health-degraded: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [
              {
                "title": "⚠️ Health Degraded",
                "description": "Application **{{.app.metadata.name}}** health status has degraded.",
                "color": 16776960,
                "fields": [
                  {
                    "name": "Health Status",
                    "value": "{{.app.status.health.status}}",
                    "inline": true
                  },
                  {
                    "name": "Sync Status",
                    "value": "{{.app.status.sync.status}}",
                    "inline": true
                  }
                ]
              }
            ]
          }
  template.app-sync-failed: |
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [
              {
                "title": "❌ Sync Failed",
                "description": "Application **{{.app.metadata.name}}** sync has failed.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Sync Status",
                    "value": "{{.app.status.sync.status}}",
                    "inline": true
                  },
                  {
                    "name": "Error Message",
                    "value": "{{.app.status.operationState.message}}",
                    "inline": false
                  }
                ],
                "timestamp": "{{.app.status.operationState.finishedAt}}"
              }
            ]
          }
  trigger.on-deployed: |
    - description: Application is synced and healthy
      send:
      - app-deployed
      when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
  trigger.on-health-degraded: |
    - description: Application health status has degraded
      send:
      - app-health-degraded
      when: app.status.health.status == 'Degraded'
  trigger.on-sync-failed: |
    - description: Application sync has failed
      send:
      - app-sync-failed
      when: app.status.operationState.phase in ['Error', 'Failed']
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: argocd
  name: argocd-notifications-cm
  namespace: argo-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: secret-pin
  name: secret-pin
  namespace: argo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-pin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-pin
    spec:
      containers:
      - image: registry.k8s.io/pause:3.10.1
        imagePullPolicy: IfNotPresent
        name: pause
        resources:
          limits:
            cpu: 1m
            memory: 10Mi
          requests:
            cpu: 1m
            memory: 1Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /mnt/secrets-store
          name: secrets-store-inline
          readOnly: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: secret-pin
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: sakuracloud-secret
        name: secrets-store-inline
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-metrics
  namespace: argo-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: argo-cd
  ingress:
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: metrics
        protocol: TCP
      rules:
        http:
        - method: GET
          path: /metrics
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argo-system
spec:
  hostnames:
  - argocd.k8s-prod.ictsc.net
  parentRefs:
  - name: web
    namespace: gateway
  rules:
  - backendRefs:
    - name: argo-cd-argocd-server
      port: 81
    matches:
    - headers:
      - name: Content-Type
        value: application/grpc
  - backendRefs:
    - name: argo-cd-argocd-server
      port: 80
    matches:
    - method: GET
      path:
        type: PathPrefix
        value: /api/v1/stream/
    timeouts:
      request: 1h
  - backendRefs:
    - name: argo-cd-argocd-server
      port: 80
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argocd-metrics
  namespace: argo-system
spec:
  jobLabel: app.kubernetes.io/name
  podMetricsEndpoints:
  - port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/instance: argo-cd
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sakuracloud-secret
  namespace: argo-system
spec:
  parameters:
    secrets: |
      - name: argocd-client-secret
      - name: argocd-github-webhook-secret
      - name: argocd-discord-webhook-url
    vaultID: "113702773889"
  provider: sakuracloud
  secretObjects:
  - data:
    - key: clientSecret
      objectName: argocd-client-secret
    labels:
      app.kubernetes.io/part-of: argocd
    secretName: oidc-secret
    type: Opaque
  - data:
    - key: webhookSecret
      objectName: argocd-github-webhook-secret
    labels:
      app.kubernetes.io/part-of: argocd
    secretName: github-secret
    type: Opaque
  - data:
    - key: discord-webhook-url
      objectName: argocd-discord-webhook-url
    labels:
      app.kubernetes.io/part-of: argocd
    secretName: argocd-notifications-secret
    type: Opaque
