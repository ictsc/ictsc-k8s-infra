apiVersion: v1
kind: ServiceAccount
metadata:
  name: scoreserver
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scoreserver-batch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discord-admin-bot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scoreserver-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scoreserver-admin
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["scoreserver-admin"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scoreserver-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scoreserver-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: github:ictsc:ictsc2025
