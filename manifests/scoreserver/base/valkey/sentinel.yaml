apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: valkey-sentinel
    app.kubernetes.io/component: sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-sentinel
  labels:
    app.kubernetes.io/name: valkey-sentinel
    app.kubernetes.io/component: sentinel
spec:
  serviceName: valkey-sentinel
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-sentinel
      app.kubernetes.io/component: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-sentinel
        app.kubernetes.io/component: sentinel
    spec:
      serviceAccountName: valkey
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: valkey-sentinel
                    app.kubernetes.io/component: sentinel
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: busybox:PLACEHOLDER
          command:
            - sh
            - -c
            - |
              # Initialize main config only on first run (Sentinel writes here)
              if [ ! -f /data/sentinel.conf ]; then
                echo "include /etc/valkey/sentinel.conf" >> /data/sentinel.conf
                echo "sentinel monitor valkey valkey-0.valkey.$NAMESPACE.svc.cluster.local 6379 2" >> /data/sentinel.conf
              fi
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /etc/valkey
              name: config
              readOnly: true
            - mountPath: /data
              name: data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: sentinel
          image: valkey/valkey:PLACEHOLDER
          command:
            - valkey-sentinel
            - /data/sentinel.conf
            - --sentinel
            - announce-ip
            - $(POD_NAME).$(SERVICE_NAME).$(NAMESPACE).svc.cluster.local
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_NAME
              value: valkey-sentinel
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /etc/valkey
              name: config
              readOnly: true
            - mountPath: /data
              name: data
          ports:
            - name: sentinel
              containerPort: 26379
          resources:
            requests:
              memory: 10Mi
              cpu: 10m
            limits:
              memory: 50Mi
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command: ["valkey-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: valkey-config
            items:
              - key: sentinel.conf
                path: sentinel.conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: topolvm-provisioner
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-sentinel
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-sentinel
      app.kubernetes.io/component: sentinel
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/part-of
              operator: In
              values:
                - valkey
            - key: app.kubernetes.io/component
              operator: In
              values:
                - sentinel
      toPorts:
        - ports:
            - port: sentinel
              protocol: TCP
