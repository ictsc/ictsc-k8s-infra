apiVersion: v1
kind: Service
metadata:
  name: valkey-proxy
spec:
  selector:
    app.kubernetes.io/name: valkey-proxy
    app.kubernetes.io/component: proxy
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-proxy
  labels:
    app.kubernetes.io/name: valkey-proxy
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-proxy
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-proxy
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: valkey
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: otelcol
          restartPolicy: Always
          image: otel/opentelemetry-collector-contrib:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          args:
            - |
              --config=yaml:
                exporters:
                  otlp:
                    endpoint: otlp.telemetry:4317
                    tls:
                      insecure: true
                receivers:
                  haproxy:
                    endpoint: http://localhost:9101/stats
                    collection_interval: 15s
                processors:
                  resource:
                    attributes:
                      - action: insert
                        key: k8s.container.name
                        value: haproxy
                service:
                  pipelines:
                    metrics:
                      receivers: [haproxy]
                      processors: [resource]
                      exporters: [otlp]
                  telemetry:
                    metrics:
                      level: none
                      readers: []
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 48Mi
              cpu: 20m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: haproxy
          image: haproxy:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 80Mi
              cpu: 10m
            limits:
              memory: 100Mi
              cpu: 100m
          ports:
            - name: healthz
              containerPort: 8888
            - name: valkey
              containerPort: 6379
            - name: stats
              containerPort: 9101
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 3
      volumes:
        - name: config
          configMap:
            name: valkey-config
            items:
              - key: haproxy.cfg
                path: haproxy.cfg
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-proxy
      app.kubernetes.io/component: proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: scoreserver-backend
      toPorts:
        - ports:
            - port: valkey
              protocol: TCP
