apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/name: valkey-proxy
    app.kubernetes.io/part-of: valkey
  name: valkey-proxy
  namespace: scoreserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/name: valkey-proxy
      app.kubernetes.io/part-of: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/name: valkey-proxy
        app.kubernetes.io/part-of: valkey
    spec:
      containers:
      - image: haproxy:3.2.9
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 3
        name: haproxy
        ports:
        - containerPort: 8888
          name: healthz
        - containerPort: 6379
          name: valkey
        - containerPort: 9101
          name: stats
        readinessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 10m
            memory: 80Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /usr/local/etc/haproxy
          name: config
          readOnly: true
      initContainers:
      - args:
        - |
          --config=yaml:
            exporters:
              otlp:
                endpoint: otlp.telemetry:4317
                tls:
                  insecure: true
            receivers:
              haproxy:
                endpoint: http://localhost:9101/stats
                collection_interval: 15s
            processors:
              resource:
                attributes:
                  - action: insert
                    key: k8s.container.name
                    value: haproxy
            service:
              pipelines:
                metrics:
                  receivers: [haproxy]
                  processors: [resource]
                  exporters: [otlp]
              telemetry:
                metrics:
                  level: none
                  readers: []
        image: otel/opentelemetry-collector-contrib:0.140.1
        imagePullPolicy: IfNotPresent
        name: otelcol
        resources:
          limits:
            cpu: 20m
            memory: 48Mi
          requests:
            cpu: 10m
            memory: 32Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: valkey
      volumes:
      - configMap:
          items:
          - key: haproxy.cfg
            path: haproxy.cfg
          name: valkey-config-m67g9dkbb8
        name: config
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/part-of: valkey
  name: valkey
  namespace: scoreserver
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: valkey
  serviceName: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: valkey
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: valkey
                  app.kubernetes.io/name: valkey
                  app.kubernetes.io/part-of: valkey
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - valkey-server
        - /var/lib/valkey/valkey.conf
        - --maxmemory
        - $(MEM_REQUEST_BYTES)
        - --replica-announce-ip
        - $(POD_NAME).$(SERVICE_NAME).$(POD_NAMESPACE).svc.cluster.local
        env:
        - name: MEM_REQUEST_BYTES
          valueFrom:
            resourceFieldRef:
              resource: requests.memory
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SERVICE_NAME
          value: valkey
        image: valkey/valkey:9.0.0-trixie
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        name: valkey
        ports:
        - containerPort: 6379
          name: valkey
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/valkey
          name: config
          readOnly: true
        - mountPath: /var/lib/valkey
          name: data
      initContainers:
      - command:
        - sh
        - -c
        - |
          POD_PREFIX=$(hostname | sed -E 's/-[0-9]+$//')
          ORDINAL=$(hostname | sed -E "s/^${POD_PREFIX}-//")

          # Initialize config only on first run
          if [ ! -f /var/lib/valkey/valkey.conf ]; then
            # Include static config from ConfigMap
            echo "include /etc/valkey/valkey.conf" > /var/lib/valkey/valkey.conf
            echo "" >> /var/lib/valkey/valkey.conf

            # Set initial replication config
            if [ "$ORDINAL" -ne "0" ]; then
              echo "replicaof $POD_PREFIX-0.$SERVICE_NAME 6379" >> /var/lib/valkey/valkey.conf
            fi
          fi
        env:
        - name: SERVICE_NAME
          value: valkey
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        name: init-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/valkey
          name: config
        - mountPath: /var/lib/valkey
          name: data
      - args:
        - |
          --config=yaml:
            exporters:
              otlp:
                endpoint: otlp.telemetry:4317
                tls:
                  insecure: true
            receivers:
              redis:
                endpoint: localhost:6379
                collection_interval: 15s
                metrics:
                  redis.maxmemory:
                    enabled: true
                  redis.role:
                    enabled: true
            processors:
              resource:
                attributes:
                  - action: insert
                    key: k8s.container.name
                    value: valkey
            service:
              pipelines:
                metrics:
                  receivers: [redis]
                  processors: [resource]
                  exporters: [otlp]
        image: otel/opentelemetry-collector-contrib:0.140.1
        imagePullPolicy: IfNotPresent
        name: otelcol
        resources:
          limits:
            cpu: 20m
            memory: 48Mi
          requests:
            cpu: 10m
            memory: 32Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: valkey
      volumes:
      - configMap:
          items:
          - key: valkey.conf
            path: valkey.conf
          name: valkey-config-m67g9dkbb8
        name: config
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/part-of: valkey
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: topolvm-provisioner
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: sentinel
    app.kubernetes.io/name: valkey-sentinel
    app.kubernetes.io/part-of: valkey
  name: valkey-sentinel
  namespace: scoreserver
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: sentinel
      app.kubernetes.io/name: valkey-sentinel
      app.kubernetes.io/part-of: valkey
  serviceName: valkey-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sentinel
        app.kubernetes.io/name: valkey-sentinel
        app.kubernetes.io/part-of: valkey
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: sentinel
                  app.kubernetes.io/name: valkey-sentinel
                  app.kubernetes.io/part-of: valkey
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - valkey-sentinel
        - /data/sentinel.conf
        - --sentinel
        - announce-ip
        - $(POD_NAME).$(SERVICE_NAME).$(NAMESPACE).svc.cluster.local
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVICE_NAME
          value: valkey-sentinel
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: valkey/valkey:9.0.0-trixie
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26379"
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        name: sentinel
        ports:
        - containerPort: 26379
          name: sentinel
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26379"
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 10Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/valkey
          name: config
          readOnly: true
        - mountPath: /data
          name: data
      initContainers:
      - command:
        - sh
        - -c
        - |
          # Initialize main config only on first run (Sentinel writes here)
          if [ ! -f /data/sentinel.conf ]; then
            echo "include /etc/valkey/sentinel.conf" >> /data/sentinel.conf
            echo "sentinel monitor valkey valkey-0.valkey.$NAMESPACE.svc.cluster.local 6379 2" >> /data/sentinel.conf
          fi
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: busybox:1.37.0
        name: init-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/valkey
          name: config
          readOnly: true
        - mountPath: /data
          name: data
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: valkey
      volumes:
      - configMap:
          items:
          - key: sentinel.conf
            path: sentinel.conf
          name: valkey-config-m67g9dkbb8
        name: config
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/part-of: valkey
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Mi
      storageClassName: topolvm-provisioner
---
