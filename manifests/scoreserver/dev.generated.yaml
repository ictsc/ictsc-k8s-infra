apiVersion: v1
data:
  haproxy.cfg: "global\n\tdns-accept-family ipv6\n\ndefaults REDIS\n\tmode tcp\n\ttimeout
    connect 4s\n\ttimeout server 330s\n\ttimeout client 330s\n\ttimeout check 2s\n\nlisten
    health_check\n\tbind [::]:8888 v4v6\n\tmode http\n\tmonitor-uri /healthz\n\toption
    dontlognull\n\nfrontend stats\n\tbind [::]:9101 v4v6\n\tmode http\n\tstats enable\n\tstats
    uri /stats\n\tstats refresh 10s\n\nresolvers kube_dns\n\tparse-resolv-conf\n\n\thold
    valid 10s\n\n\tresolve_retries 3\n\ttimeout retry 1s\n\ttimeout resolve 1s\n\nfrontend
    fe_valkey_leader\n\tbind [::]:6379 v4v6\n\tuse_backend bk_valkey_leader\n\nbackend
    bk_valkey_leader\n\tmode tcp\n\toption tcp-check\n\ttcp-check connect\n\ttcp-check
    send PING\\r\\n\n\ttcp-check expect string +PONG\n\ttcp-check send info\\ replication\\r\\n\n\ttcp-check
    expect string role:master\n\ttcp-check expect rstring connected_slaves:[1-9]\n\ttcp-check
    send QUIT\\r\\n\n\tserver-template valkey 5 _valkey._tcp.valkey.scoreserver.svc.cluster.local
    resolvers kube_dns check inter 1s fall 1 rise 1\n"
  sentinel.conf: |
    port 26379
    bind 0.0.0.0 ::
    protected-mode no

    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes

    sentinel down-after-milliseconds valkey 5000
    sentinel failover-timeout valkey 10000
    sentinel parallel-syncs valkey 1
  valkey.conf: |
    # Valkey Configuration
    port 6379
    bind 0.0.0.0 ::
    protected-mode no

    # Persistence
    dir /var/lib/valkey
    appendonly yes
    appendfsync everysec

    # Replication
    replica-read-only yes
    replica-serve-stale-data yes

    # Memory
    maxmemory-policy allkeys-lru
kind: ConfigMap
metadata:
  labels:
