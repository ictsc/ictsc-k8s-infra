apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scoreserver-app
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: scoreserver
  source:
    repoURL: https://github.com/ictsc/ictsc-regalia-release
    targetRevision: main
    path: prod
  syncPolicy:
    automated: {}
    syncOptions:
      - ServerSideApply=true
