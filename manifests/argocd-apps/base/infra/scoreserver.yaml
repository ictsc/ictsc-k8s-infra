apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scoreserver
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: scoreserver
  source:
    repoURL: https://github.com/ictsc/ictsc-k8s-infra
    targetRevision: main
    path: manifests/scoreserver
  syncPolicy:
    syncOptions: []
    automated: {}
