resources:
  - ../base

configurations:
  - ../crds/images_transformer_configurations.yaml

patches:
  - target:
      kind: HTTPRoute
      name: telemetry
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: "telemetry.k8s-dev.ictsc.net"

images:
  - name: prometheus-operator
    newName: quay.io/prometheus-operator/prometheus-operator
    newTag: v0.86.2
  - name: prometheus
    newName: quay.io/prometheus/prometheus
    newTag: v3.7.1
