apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configurations:
  - ./images_transformer_configurations.yaml

replacements:
  - source:
      kind: ConfigMap
      name: cluster-param
      fieldPath: data.k8s-domain
    targets:
      - select:
          kind: HTTPRoute
          name: telemetry
        options:
          delimiter: "."
          index: 1
        fieldPaths:
          - spec.hostnames.0
  - source:
      kind: ConfigMap
      name: cluster-param
      fieldPath: data.cluster-name
    targets:
      - select:
          kind: DaemonSet
          name: collector
        fieldPaths:
          - spec.template.spec.containers.[name=otelcol].env.[name=K8S_CLUSTER_NAME].value
  - source:
      kind: ConfigMap
      name: cluster-param
      fieldPath: data.vault-id
    targets:
      - select:
          kind: SecretProviderClass
          name: telemetry-s3-credentials
        fieldPaths:
          - spec.parameters.vaultID
  - source:
      kind: ConfigMap
      name: cluster-param
      fieldPath: data.thanos-prefix
    targets:
      - select:
          kind: ConfigMap
          name: thanos-object-store-config
        fieldPaths:
          - data.bucket\.yaml.prefix
  - source:
      kind: ConfigMap
      name: cluster-param
      fieldPath: data.loki-prefix
    targets:
      - select:
          kind: ConfigMap
          labelSelector: app.kubernetes.io/name=loki
        fieldPaths:
          - data.config\.yaml.common.storage.object_store.storage_prefix
