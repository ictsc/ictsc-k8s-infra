auth_enabled: false

server:
  grpc_listen_port: 9095
  http_listen_port: 3100
  http_server_read_timeout: 600s
  http_server_write_timeout: 600s

runtime_config:
  file: /etc/loki/runtime-config/runtime-config.yaml

common:
  path_prefix: /var/loki
  replication_factor: 2
  compactor_grpc_address: loki-backend:9095
  ring:
    kvstore:
      store: memberlist
    instance_enable_ipv6: true
  storage:
    object_store:
      storage_prefix: $loki-prefix
      s3:
        bucket_name: ictsc-k8s-telemetry
        endpoint: s3.isk01.sakurastorage.jp
        region: jp-north-1

storage_config:
  use_thanos_objstore: true
  hedging:
    at: 250ms
    max_per_second: 20
    up_to: 3

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      schema: v13
      object_store: s3
      index:
        period: 24h
        prefix: index_

memberlist:
  bind_addr: ["::"]
  join_members:
    - loki-memberlist

limits_config:
  max_cache_freshness_per_query: 10m
  query_timeout: 300s
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  split_queries_by_interval: 15m
  volume_enabled: true
  allow_structured_metadata: true
  retention_period: 744h

# Backend
index_gateway:
  mode: simple
  ring:
    instance_enable_ipv6: true

query_scheduler:
  scheduler_ring:
    instance_enable_ipv6: true

ruler:
  wal:
    dir: /var/loki/ruler-wal
  ring:
    instance_enable_ipv6: true
ruler_storage:
  backend: local
  local:
    directory: /rules

compactor:
  compactor_ring:
    instance_enable_ipv6: true
  retention_enabled: true
  delete_request_store: s3

# Read
frontend:
  instance_enable_ipv6: true
querier:
  max_concurrent: 4
query_range:
  align_queries_with_step: true

# Write
ingester:
  chunk_encoding: lz4
  lifecycler:
    enable_inet6: true
pattern_ingester:
  enabled: true
  lifecycler:
    enable_inet6: true
distributor:
  ring:
    instance_enable_ipv6: true
