connectors:
  forward: {}

exporters:
  otlphttp/prometheus0:
    endpoint: http://prometheus-prometheus-0.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp
  otlphttp/prometheus1:
    endpoint: http://prometheus-prometheus-1.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp
  otlphttp/loki:
    endpoint: http://loki-write:3100/otlp
  otlphttp/mackerel:
    endpoint: https://otlp-vaxila.mackerelio.com
    headers:
      Accept: "*/*"
      "Mackerel-Api-Key": "${file:/run/secrets/mackerel-api-key}"
    sending_queue:
      batch:
        min_size: 5000
        max_size: 5000
        sizer: items

extensions:
  pprof:
  health_check:
    endpoint: "[${env:POD_IP}]:13133"
  k8s_leader_elector:
    auth_type: serviceAccount
    lease_name: collector-leader-election
    lease_namespace: "${env:POD_NAMESPACE}"

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:MEMORY_LIMIT_MIB}
    spike_limit_percentage: 20

  k8sattributes:
    auth_type: serviceAccount
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      otel_annotations: true # resource.opentelemetry.io/name -> name
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.ip
        - k8s.deployment.name
        - k8s.daemonset.name
        - k8s.statefulset.name
        - k8s.cronjob.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.start_time
        - service.namespace
        - service.name
        - service.version
        - service.instance.id
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection

  resource:
    attributes:
      - action: insert
        key: k8s.cluster.name
        value: "${env:K8S_CLUSTER_NAME}"

  resource/k8s_cluster:
    attributes:
      - action: insert
        key: service.name
        value: k8s_cluster
      # Container
      - action: insert
        key: service.instance.id
        from_attribute: container.id
      # Pod
      - action: insert
        key: service.instance.id
        from_attribute: k8s.pod.uid
      # Job
      - action: insert
        key: service.instance.id
        from_attribute: k8s.job.uid
      # CronJob
      - action: insert
        key: service.instance.id
        from_attribute: k8s.cronjob.uid
      # ReplicaSet
      - action: insert
        key: service.instance.id
        from_attribute: k8s.replicaset.uid
      # DaemonSet
      - action: insert
        key: service.instance.id
        from_attribute: k8s.daemonset.uid
      # StatefulSet
      - action: insert
        key: service.instance.id
        from_attribute: k8s.statefulset.uid
      # Deployment
      - action: insert
        key: service.instance.id
        from_attribute: k8s.deployment.uid
      # ResourceQuota
      - action: insert
        key: service.instance.id
        from_attribute: k8s.resourcequota.uid
      # Node
      - action: insert
        key: service.instance.id
        from_attribute: k8s.node.uid
      # Namespace
      - action: insert
        key: service.instance.id
        from_attribute: k8s.namespace.uid

  resource/k8sobjects:
    attributes:
      - action: insert
        key: service.name
        value: k8sobjects

  resource/kubelet:
    attributes:
      - action: insert
        key: k8s.node.name
        value: "${env:K8S_NODE_NAME}"
      - action: insert
        key: service.name
        value: kubelet
      - action: insert
        key: service.instance.id
        from_attribute: k8s.pod.uid
      - action: insert
        key: service.instance.id
        from_attribute: k8s.node.name

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[${env:POD_IP}]:4317"
      http:
        endpoint: "[${env:POD_IP}]:4318"

  otlp/local:
    protocols:
      grpc:
        endpoint: "[${env:POD_IP}]:14317"

  k8s_cluster:
    k8s_leader_elector: k8s_leader_elector
    collection_interval: 15s
    node_conditions_to_report:
      - Ready
      - MemoryPressure
    allocatable_types_to_report:
      - cpu
      - memory
      - pods

  k8sobjects:
    auth_type: serviceAccount
    k8s_leader_elector: k8s_leader_elector
    objects:
      - name: pods
        mode: pull
        interval: 15m
      - name: events
        mode: watch

  kubeletstats:
    collection_interval: 15s
    initial_delay: 1s
    auth_type: serviceAccount
    endpoint: "https://[${env:K8S_NODE_IP}]:10250"
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    metric_groups:
      - container
      - pod
      - node
      - volume

  prometheus/kubelet:
    config:
      scrape_configs:
        - job_name: kubelet
          scrape_interval: 15s
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          authorization:
            type: Bearer
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          static_configs:
            - targets:
                - "[${env:K8S_NODE_IP}]:10250"

  prometheus:
    target_allocator:
      endpoint: http://target-allocator
      interval: 30s
      collector_id: "${env:POD_NAME}"

service:
  extensions:
    - pprof
    - health_check
    - k8s_leader_elector

  pipelines:
    metrics/otlp:
      receivers: [otlp]
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      exporters: [forward]
    logs/otlp:
      receivers: [otlp]
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      exporters: [forward]
    traces/otlp:
      receivers: [otlp]
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      exporters: [forward]

    metrics/prometheus:
      receivers: [prometheus]
      processors:
        - memory_limiter
        - batch
        - k8sattributes
      exporters: [forward]

    metrics/k8s_cluster:
      receivers: [k8s_cluster]
      processors:
        - memory_limiter
        - batch
        - resource/k8s_cluster
      exporters: [forward]
    logs/k8sobjects:
      receivers: [k8sobjects]
      processors:
        - memory_limiter
        - batch
        - k8sattributes
        - resource/k8sobjects
      exporters: [forward]

    metrics/kubeletstats:
      receivers:
        - kubeletstats
        - prometheus/kubelet
      processors:
        - memory_limiter
        - batch
        - k8sattributes
        - resource/kubelet
      exporters: [forward]

    logs/podlog:
      receivers: [otlp/local]
      processors:
        - memory_limiter
        - batch
        - k8sattributes
      exporters: [forward]

    metrics/export:
      receivers: [forward]
      processors: [resource]
      exporters:
        - otlphttp/prometheus0
        - otlphttp/prometheus1
    logs/export:
      receivers: [forward]
      processors: [resource]
      exporters: [otlphttp/loki]
    traces/export:
      receivers: [forward]
      processors: [resource]
      exporters: [otlphttp/mackerel]

  telemetry:
    resource:
      k8s.pod.name: ${env:POD_NAME}
      k8s.pod.uid: ${env:POD_UID}
      k8s.daemonset.name: ${env:K8S_DAEMONSET_NAME}
      k8s.namespace.name: ${env:POD_NAMESPACE}
      k8s.node.name: ${env:K8S_NODE_NAME}
      service.name: otelcol
      service.namespace: ${env:POD_NAMESPACE}
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://prometheus-prometheus-0.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp/v1/metrics
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://prometheus-prometheus-1.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp/v1/metrics
