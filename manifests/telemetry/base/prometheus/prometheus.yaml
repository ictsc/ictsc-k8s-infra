apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  probeSelector: {}
  otlp:
    convertHistogramsToNHCB: true
    promoteResourceAttributes:
      - service.instance.id
      - service.name
      - service.namespace
      - service.version
      - cloud.availability_zone
      - cloud.region
      - container.name
      - deployment.environment
      - deployment.environment.name
      - k8s.cluster.name
      - k8s.container.name
      - k8s.cronjob.name
      - k8s.daemonset.name
      - k8s.deployment.name
      - k8s.job.name
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.replicaset.name
      - k8s.statefulset.name
      - k8s.node.name
      - k8s.volume.name
  tsdb:
    outOfOrderTimeWindow: 30m
  enableFeatures:
    - native-histograms
    - promql-experimental-functions
  retention: 24h

  image: prometheus:TO_BE_FILLED
  replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
          topologyKey: kubernetes.io/hostname
  securityContext:
    fsGroup: 2000
    runAsUser: 65534
  resources:
    limits:
      memory: 1Gi
      cpu: "1"
    requests:
      memory: 512Mi
      cpu: 200m

  thanos:
    image: thanos:TO_BE_FILLED
    objectStorageConfigFile: /etc/thanos/bucket.yaml
    volumeMounts:
      - name: thanos-secrets-store
        mountPath: /mnt/secrets-store
        readOnly: true
      - name: thanos-object-store-config
        mountPath: /etc/thanos
        readOnly: true

  containers:
    - name: thanos-sidecar
      env:
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: WHEN_REQUIRED
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: WHEN_REQUIRED
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /mnt/secrets-store/sakuracloud-s3-telemetry-credentials

  volumes:
    - name: thanos-secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: telemetry-s3-credentials
    - name: thanos-object-store-config
      configMap:
        name: thanos-object-store-config

  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: topolvm-provisioner
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: collector
      toPorts:
        - ports:
            - port: web
              protocol: TCP
          rules:
            http:
              - method: POST
                path: /api/v1/otlp/v1/metrics
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: thanos-query
      toPorts:
        - ports:
            - port: grpc
              protocol: TCP
          rules:
            http: [{}]
