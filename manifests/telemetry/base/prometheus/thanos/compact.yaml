apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-compact
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: thanos-compact
spec:
  schedule: "0 */6 * * *"
  startingDeadlineSeconds: 3600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compact
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: thanos-compact
        spec:
          serviceAccountName: thanos-compact
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: thanos-compact
              image: thanos:TO_BE_FILLED
              imagePullPolicy: IfNotPresent
              args:
                - compact
                - --enable-auto-gomemlimit
                - --http-address=0.0.0.0:10902
                - --data-dir=/data
                - --objstore.config-file=/etc/thanos/bucket.yaml
                - --retention.resolution-raw=1y
                - --retention.resolution-5m=1y
                - --retention.resolution-1h=1y
                - --deduplication.func=penalty
                - --deduplication.replica-label=prometheus_replica
              env:
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: WHEN_REQUIRED
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: WHEN_REQUIRED
                - name: AWS_SHARED_CREDENTIALS_FILE
                  value: /mnt/secrets-store/sakuracloud-s3-telemetry-credentials
              volumeMounts:
                - name: thanos-data
                  mountPath: /data
                - name: thanos-s3-secrets
                  mountPath: /mnt/secrets-store
                  readOnly: true
                - name: thanos-object-store-config
                  mountPath: /etc/thanos
                  readOnly: true
              ports:
                - name: http
                  containerPort: 10902
              livenessProbe:
                httpGet:
                  path: /-/healthy
                  port: http
                failureThreshold: 4
                periodSeconds: 30
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: thanos-data
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    storageClassName: topolvm-provisioner
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 1Gi
            - name: thanos-s3-secrets
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: telemetry-s3-credentials
            - name: thanos-object-store-config
              configMap:
                name: thanos-object-store-config
