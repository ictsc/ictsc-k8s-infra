  - port: http
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: prometheus
  name: prometheus
  namespace: telemetry
spec:
  additionalArgs:
  - name: auto-gomemlimit.ratio
    value: "0.6"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
        topologyKey: kubernetes.io/hostname
  containers:
  - env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: WHEN_REQUIRED
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: WHEN_REQUIRED
    - name: AWS_SHARED_CREDENTIALS_FILE
      value: /mnt/secrets-store/sakuracloud-s3-telemetry-credentials
    name: thanos-sidecar
  enableFeatures:
  - native-histograms
  - promql-experimental-functions
  image: quay.io/prometheus/prometheus:v3.7.3
  otlp:
    convertHistogramsToNHCB: true
    promoteResourceAttributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - k8s.node.name
    - k8s.volume.name
  probeSelector: {}
  replicas: 2
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  retention: 24h
  securityContext:
    fsGroup: 2000
    runAsUser: 65534
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: topolvm-provisioner
  thanos:
    image: quay.io/thanos/thanos:v0.40.1
    objectStorageConfigFile: /etc/thanos/bucket.yaml
    volumeMounts:
    - mountPath: /mnt/secrets-store
      name: thanos-secrets-store
      readOnly: true
    - mountPath: /etc/thanos
      name: thanos-object-store-config
      readOnly: true
  tsdb:
    outOfOrderTimeWindow: 30m
  volumes:
  - csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: telemetry-s3-credentials
    name: thanos-secrets-store
  - configMap:
      name: thanos-object-store-config
    name: thanos-object-store-config
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/part-of: prometheus
  name: coredns
  namespace: telemetry
spec:
  endpoints:
  - interval: 15s
    port: metrics
  namespaceSelector:
    matchNames:
    - kube-system
  selector:
    matchLabels:
      k8s-app: kube-dns
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/part-of: prometheus
  name: k0s-metrics
  namespace: telemetry
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: http
  jobLabel: app
  namespaceSelector:
    matchNames:
    - k0s-system
  selector:
    matchLabels:
      app: k0s-observability
      component: pushgateway
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/part-of: prometheus
  name: kube-apiserver
  namespace: telemetry
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    interval: 30s
    path: /metrics
    port: https
    scheme: https
    tlsConfig:
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      serverName: kubernetes
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    interval: 5s
    path: /metrics/slis
    port: https
    scheme: https
    tlsConfig:
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      serverName: kubernetes
  jobLabel: component
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: telemetry-s3-credentials
  namespace: telemetry
spec:
  parameters:
    secrets: |
      - name: sakuracloud-s3-telemetry-credentials
    vaultID: "113702555287"
  provider: sakuracloud
