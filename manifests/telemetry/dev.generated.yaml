apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/part-of: prometheus
  name: thanos-compact
  namespace: telemetry
spec:
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compact
    spec:
      backoffLimit: 3
      completions: 1
      parallelism: 1
      template:
        metadata:
          annotations:
            kubernetes.io/egress-bandwidth: 25M
            kubernetes.io/ingress-bandwidth: 25M
          labels:
            app.kubernetes.io/name: thanos-compact
        spec:
          containers:
          - args:
            - compact
            - --enable-auto-gomemlimit
            - --http-address=0.0.0.0:10902
            - --data-dir=/data
            - --objstore.config-file=/etc/thanos/bucket.yaml
            - --retention.resolution-raw=1y
            - --retention.resolution-5m=1y
            - --retention.resolution-1h=1y
            - --deduplication.func=penalty
            - --deduplication.replica-label=prometheus_replica
            env:
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: WHEN_REQUIRED
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: WHEN_REQUIRED
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /mnt/secrets-store/sakuracloud-s3-telemetry-credentials
            image: quay.io/thanos/thanos:v0.40.1
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 4
              httpGet:
                path: /-/healthy
                port: http
              periodSeconds: 30
            name: thanos-compact
            ports:
            - containerPort: 10902
              name: http
            resources:
              limits:
                cpu: "1"
                memory: 500Mi
              requests:
                cpu: 100m
                memory: 250Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /data
              name: thanos-data
            - mountPath: /mnt/secrets-store
              name: thanos-s3-secrets
              readOnly: true
            - mountPath: /etc/thanos
              name: thanos-object-store-config
              readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: thanos-compact
          volumes:
          - ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
                  storageClassName: topolvm-provisioner
            name: thanos-data
          - csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: telemetry-s3-credentials
            name: thanos-s3-secrets
          - configMap:
              name: thanos-object-store-config
            name: thanos-object-store-config
  schedule: 0 */6 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 0
