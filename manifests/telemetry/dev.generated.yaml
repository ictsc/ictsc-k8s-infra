apiVersion: v1
data:
  config.yaml: |
    connectors:
      forward: {}

    exporters:
      otlphttp/prometheus0:
        endpoint: http://prometheus-prometheus-0.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp
      otlphttp/prometheus1:
        endpoint: http://prometheus-prometheus-1.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp

    extensions:
      health_check:
        endpoint: "[${env:POD_IP}]:13133"
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: collector-leader-election
        lease_namespace: "${env:POD_NAMESPACE}"

    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

      k8sattributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          otel_annotations: true # resource.opentelemetry.io/name -> name
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      resource:
        attributes:
          - action: insert
            key: k8s.cluster.name
            value: "${env:K8S_CLUSTER_NAME}"

      resource/k8s_cluster:
        attributes:
          - action: insert
            key: service.name
            value: k8s_cluster
          # Container
          - action: insert
            key: service.instance.id
            from_attribute: container.id
          # Pod
          - action: insert
            key: service.instance.id
            from_attribute: k8s.pod.uid
          # Job
          - action: insert
            key: service.instance.id
            from_attribute: k8s.job.uid
          # CronJob
          - action: insert
            key: service.instance.id
            from_attribute: k8s.cronjob.uid
          # ReplicaSet
          - action: insert
            key: service.instance.id
            from_attribute: k8s.replicaset.uid
          # DaemonSet
          - action: insert
            key: service.instance.id
            from_attribute: k8s.daemonset.uid
          # StatefulSet
          - action: insert
            key: service.instance.id
            from_attribute: k8s.statefulset.uid
          # Deployment
          - action: insert
            key: service.instance.id
            from_attribute: k8s.deployment.uid
          # ResourceQuota
          - action: insert
            key: service.instance.id
            from_attribute: k8s.resourcequota.uid
          # Node
          - action: insert
            key: service.instance.id
            from_attribute: k8s.node.uid
          # Namespace
          - action: insert
            key: service.instance.id
            from_attribute: k8s.namepace.uid

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "[${env:POD_IP}]:4317"
          http:
            endpoint: "[${env:POD_IP}]:4318"

      k8s_cluster:
        k8s_leader_elector: k8s_leader_elector
        collection_interval: 15s

    service:
      extensions:
        - health_check
        - k8s_leader_elector

      pipelines:
        metrics/otlp:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - batch
          exporters: [forward]

        metrics/k8s_cluster:
          receivers: [k8s_cluster]
          processors:
            - memory_limiter
            - batch
            - resource/k8s_cluster
          exporters: [forward]

        metrics/export:
          receivers: [forward]
          processors: [resource]
          exporters:
            - otlphttp/prometheus0
            - otlphttp/prometheus1

      telemetry:
        resource:
          k8s.pod.name: ${env:POD_NAME}
          k8s.pod.uid: ${env:POD_UID}
          k8s.daemonset.name: ${env:K8S_DAEMONSET_NAME}
          k8s.namespace.name: ${env:POD_NAMESPACE}
          k8s.node.name: ${env:K8S_NODE_NAME}
          service.name: otelcol
          service.namespace: ${env:POD_NAMESPACE}
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://prometheus-prometheus-0.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp/v1/metrics
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://prometheus-prometheus-1.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp/v1/metrics
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: opentelemetry-collector
  name: collector-config-ctbcd9g672
  namespace: telemetry
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: opentelemetry-collector
  name: otlp
  namespace: telemetry
spec:
  internalTrafficPolicy: Local
  ports:
  - name: grpc
    port: 4317
    targetPort: otlp-grpc
  - name: http
    port: 4318
    targetPort: otlp-http
  selector:
    app.kubernetes.io/name: collector
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: prometheus-operator
    app.kubernetes.io/part-of: prometheus
  name: prometheus-operator
  namespace: telemetry
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: prometheus-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: prometheus-operator
    app.kubernetes.io/part-of: prometheus
  name: prometheus-operator
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: prometheus-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: prometheus-operator
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --kubelet-service=kube-system/kubelet
        - --kubelet-endpoints=true
        - --kubelet-endpointslice=false
        env:
        - name: GOGC
          value: "30"
        image: quay.io/prometheus-operator/prometheus-operator:v0.86.2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 3
        name: prometheus-operator
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
          requests:
            cpu: 20m
            memory: 50Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: prometheus-operator
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/part-of: opentelemetry-collector
  name: collector
  namespace: telemetry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
    spec:
      containers:
      - args:
        - --config
        - /etc/otelcol/config.yaml
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_DAEMONSET_NAME
          value: collector
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_CLUSTER_NAME
          value: ictsc-dev
        - name: GOMEMLIMIT
          value: 128MiB
        image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.139.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: healthz
        name: otelcol
        ports:
        - containerPort: 13133
          name: healthz
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        readinessProbe:
          httpGet:
            path: /
            port: healthz
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - mountPath: /etc/otelcol
          name: config
      serviceAccountName: collector
      volumes:
      - configMap:
          name: collector-config-ctbcd9g672
        name: config
  updateStrategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
    type: RollingUpdate
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: opentelemetry-collector
  name: collector
  namespace: telemetry
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: collector
  ingress:
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: otlp-grpc
        protocol: TCP
      - port: otlp-http
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: prometheus
  name: prometheus
  namespace: telemetry
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: web
        protocol: TCP
      rules:
        http:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: prometheus-operator
    app.kubernetes.io/part-of: prometheus
  name: prometheus-operator
  namespace: telemetry
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: prometheus-operator
  ingress:
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: http
        protocol: TCP
      rules:
        http:
        - method: GET
          path: /metrics
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telemetry
  namespace: telemetry
spec:
  hostnames:
  - telemetry.k8s-dev.ictsc.net
  parentRefs:
  - name: web
    namespace: gateway
    sectionName: telemetry-https
  rules:
  - backendRefs:
    - name: prometheus-operated
      port: 9090
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: prometheus
  name: prometheus
  namespace: telemetry
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
        topologyKey: kubernetes.io/hostname
  enableFeatures:
  - native-histograms
  - promql-experimental-functions
  image: quay.io/prometheus/prometheus:v3.7.3
  otlp:
    convertHistogramsToNHCB: true
    promoteResourceAttributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
  probeSelector: {}
  replicas: 2
  retention: 24h
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: topolvm-provisioner
  tsdb:
    outOfOrderTimeWindow: 30m
