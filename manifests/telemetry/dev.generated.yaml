apiVersion: v1
data:
  config.yaml: |
    connectors:
      forward: {}

    exporters:
      otlphttp/prometheus0:
        endpoint: http://prometheus-prometheus-0.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp
      otlphttp/prometheus1:
        endpoint: http://prometheus-prometheus-1.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp
      otlphttp/loki:
        endpoint: http://loki-write:3100/otlp

    extensions:
      health_check:
        endpoint: "[${env:POD_IP}]:13133"
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: collector-leader-election
        lease_namespace: "${env:POD_NAMESPACE}"

    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

      k8sattributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          otel_annotations: true # resource.opentelemetry.io/name -> name
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.ip
            - k8s.deployment.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      resource:
        attributes:
          - action: insert
            key: k8s.cluster.name
            value: "${env:K8S_CLUSTER_NAME}"

      resource/k8s_cluster:
        attributes:
          - action: insert
            key: service.name
            value: k8s_cluster
          # Container
          - action: insert
            key: service.instance.id
            from_attribute: container.id
          # Pod
          - action: insert
            key: service.instance.id
            from_attribute: k8s.pod.uid
          # Job
          - action: insert
            key: service.instance.id
            from_attribute: k8s.job.uid
          # CronJob
          - action: insert
            key: service.instance.id
            from_attribute: k8s.cronjob.uid
          # ReplicaSet
          - action: insert
            key: service.instance.id
            from_attribute: k8s.replicaset.uid
          # DaemonSet
          - action: insert
            key: service.instance.id
            from_attribute: k8s.daemonset.uid
          # StatefulSet
          - action: insert
            key: service.instance.id
            from_attribute: k8s.statefulset.uid
          # Deployment
          - action: insert
            key: service.instance.id
            from_attribute: k8s.deployment.uid
          # ResourceQuota
          - action: insert
            key: service.instance.id
            from_attribute: k8s.resourcequota.uid
          # Node
          - action: insert
            key: service.instance.id
            from_attribute: k8s.node.uid
          # Namespace
          - action: insert
            key: service.instance.id
            from_attribute: k8s.namespace.uid

      resource/kubelet:
        attributes:
          - action: insert
            key: k8s.node.name
            value: "${env:K8S_NODE_NAME}"
          - action: insert
            key: service.name
            value: kubelet
          - action: insert
            key: service.instance.id
            from_attribute: k8s.pod.uid
          - action: insert
            key: service.instance.id
            from_attribute: k8s.node.name

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "[${env:POD_IP}]:4317"
          http:
            endpoint: "[${env:POD_IP}]:4318"

      otlp/local:
        protocols:
          grpc:
            endpoint: "[${env:POD_IP}]:14317"

      k8s_cluster:
        k8s_leader_elector: k8s_leader_elector
        collection_interval: 15s
        node_conditions_to_report:
          - Ready
          - MemoryPressure
        allocatable_types_to_report:
          - cpu
          - memory
          - pods

      kubeletstats:
        collection_interval: 15s
        initial_delay: 1s
        auth_type: serviceAccount
        endpoint: "https://[${env:K8S_NODE_IP}]:10250"
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        metric_groups:
          - container
          - pod
          - node
          - volume

      prometheus/kubelet:
        config:
          scrape_configs:
            - job_name: kubelet
              scrape_interval: 15s
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                    - "[${env:K8S_NODE_IP}]:10250"

      prometheus:
        target_allocator:
          endpoint: http://target-allocator
          interval: 30s
          collector_id: "${env:POD_NAME}"

    service:
      extensions:
        - health_check
        - k8s_leader_elector

      pipelines:
        metrics/otlp:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - batch
          exporters: [forward]
        logs/otlp:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - batch
          exporters: [forward]

        metrics/prometheus:
          receivers: [prometheus]
          processors:
            - memory_limiter
            - batch
            - k8sattributes
          exporters: [forward]

        metrics/k8s_cluster:
          receivers: [k8s_cluster]
          processors:
            - memory_limiter
            - batch
            - resource/k8s_cluster
          exporters: [forward]

        metrics/kubeletstats:
          receivers:
            - kubeletstats
            - prometheus/kubelet
          processors:
            - memory_limiter
            - batch
            - k8sattributes
            - resource/kubelet
          exporters: [forward]

        logs/podlog:
          receivers: [otlp/local]
          processors:
            - memory_limiter
            - batch
            - k8sattributes
          exporters: [forward]

        metrics/export:
          receivers: [forward]
          processors: [resource]
          exporters:
            - otlphttp/prometheus0
            - otlphttp/prometheus1
        logs/export:
          receivers: [forward]
          processors: [resource]
          exporters: [otlphttp/loki]

      telemetry:
        resource:
          k8s.pod.name: ${env:POD_NAME}
          k8s.pod.uid: ${env:POD_UID}
          k8s.daemonset.name: ${env:K8S_DAEMONSET_NAME}
          k8s.namespace.name: ${env:POD_NAMESPACE}
          k8s.node.name: ${env:K8S_NODE_NAME}
          service.name: otelcol
          service.namespace: ${env:POD_NAMESPACE}
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://prometheus-prometheus-0.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp/v1/metrics
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://prometheus-prometheus-1.prometheus-operated.telemetry.svc.cluster.local:9090/api/v1/otlp/v1/metrics
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: collector
    app.kubernetes.io/name: collector-config
    app.kubernetes.io/part-of: opentelemetry-collector
  name: collector-config-d9dfhhg9gk
  namespace: telemetry
---
apiVersion: v1
data:
  config.yaml: |
    exporters:
      otlp/local:
        endpoint: otlp:14317
        tls:
          insecure: true
        sending_queue:
          storage: file_storage

    extensions:
      health_check:
        endpoint: "[${env:POD_IP}]:13133"
      file_storage:
        directory: /var/lib/otelcol/file_storage
        create_directory: true
        timeout: 30s

    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log*
        exclude:
          - /var/log/pods/telemetry_collector-*/*/*.log*
          - /var/log/pods/telemetry_host-collector-*/*/*.log*
        start_at: beginning
        storage: file_storage
        include_file_path: true
        include_file_name: false
        compression: auto
        operators:
          - type: container

    service:
      extensions:
        - health_check
        - file_storage

      pipelines:
        logs:
          receivers: [filelog]
          processors:
            - memory_limiter
            - batch
          exporters: [otlp/local]
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: collector
    app.kubernetes.io/name: host-collector-config
    app.kubernetes.io/part-of: opentelemetry-collector
  name: host-collector-config-tm4m6mth8k
  namespace: telemetry
---
apiVersion: v1
data:
  config.yaml: |-
    auth_enabled: false
    server:
      grpc_listen_port: 9095
      http_listen_port: 3100
      http_server_read_timeout: 600s
      http_server_write_timeout: 600s
    runtime_config:
      file: /etc/loki/runtime-config/runtime-config.yaml
    common:
      path_prefix: /var/loki
      replication_factor: 2
      compactor_grpc_address: loki-backend:9095
      ring:
        kvstore:
          store: memberlist
        instance_enable_ipv6: true
      storage:
        object_store:
          storage_prefix: loki-dev
          s3:
            bucket_name: ictsc-k8s-telemetry
            endpoint: s3.isk01.sakurastorage.jp
            region: jp-north-1
    storage_config:
      use_thanos_objstore: true
      hedging:
        at: 250ms
        max_per_second: 20
        up_to: 3
    schema_config:
      configs:
      - from: 2024-04-01
        store: tsdb
        schema: v13
        object_store: s3
        index:
          period: 24h
          prefix: index_
    memberlist:
      bind_addr: ["::"]
      join_members:
      - loki-memberlist
    limits_config:
      max_cache_freshness_per_query: 10m
      query_timeout: 300s
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      split_queries_by_interval: 15m
      volume_enabled: true
      allow_structured_metadata: true
    # Backend
    index_gateway:
      mode: simple
      ring:
        instance_enable_ipv6: true
    query_scheduler:
      scheduler_ring:
        instance_enable_ipv6: true
    ruler:
      wal:
        dir: /var/loki/ruler-wal
      ring:
        instance_enable_ipv6: true
    ruler_storage:
      backend: local
      local:
        directory: /rules
    compactor:
      compactor_ring:
        instance_enable_ipv6: true
    # Read
    frontend:
      instance_enable_ipv6: true
    querier:
      max_concurrent: 4
    query_range:
      align_queries_with_step: true
    # Write
    ingester:
      chunk_encoding: lz4
      lifecycler:
        enable_inet6: true
    pattern_ingester:
      enabled: true
      lifecycler:
        enable_inet6: true
    distributor:
      ring:
        instance_enable_ipv6: true
